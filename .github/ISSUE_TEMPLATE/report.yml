name: Report a problem
description: A crash, a graphics glitch, low fps, a controller problem or anything else that goes wrong.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a useful log, turn on **Debug logging** first (CTRL → Troubleshooting), restart the game and make the problem happen.
        Newer versions have **CTRL → Troubleshooting → Report a problem on GitHub**, which saves your logs and fills in the version, phone, GPU and settings below. On older versions, use **CTRL → Troubleshooting → Save logs for a bug report** and attach the zip.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you saw and what you expected. Where in the game? Does it happen every time?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Attach the LR-FFXIII-logs-….zip (the Report button saves it in Download; Save logs for a bug report makes one too). GitHub takes files up to 25 MB. Screenshots or a short video help with graphics problems.
  - type: input
    id: version
    attributes:
      label: Port version
      description: The version of this port (1.2.6, ...), shown on the release you installed.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or handheld, chip and Android version
      placeholder: e.g. AYN Thor, SM8550, Android 13
  - type: input
    id: gpu
    attributes:
      label: GPU and GPU driver
      placeholder: e.g. Adreno 740, System / Adreno 640, Turnip
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: Resolution, frame rate, Wide screen and anything you changed in CTRL.
      render: text
